<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Banana Brain Quest</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../css/auth.css" />
  <script src="../js/register.js" defer></script>
</head>

<body>
  <main class="auth-container">
    <div class="auth-header">
      <span class="auth-icon">✨</span>
      <span class="eyebrow">NEW CHALLENGER</span>
      <h1 class="auth-title">CREATE ACCOUNT</h1>
      <p class="auth-subtitle">Join Banana Brain Quest and compete with players worldwide.</p>
    </div>

    <form id="register-form" class="auth-form" novalidate>
      <div class="form-group">
        <label for="reg-username">Username</label>
        <input id="reg-username" name="username" type="text" placeholder="Choose a username" required minlength="3" maxlength="50" autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="reg-email">Email Address</label>
        <input id="reg-email" name="email" type="email" placeholder="Enter your email" required maxlength="100" autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="reg-password">Password</label>
        <input id="reg-password" name="password" type="password" placeholder="Create a strong password (min 6 chars)" required minlength="6" autocomplete="new-password" />
      </div>

      <div class="form-group">
        <label for="reg-confirm-password">Confirm Password</label>
        <input id="reg-confirm-password" name="confirmPassword" type="password" placeholder="Re-enter your password" required minlength="6" autocomplete="new-password" />
      </div>

      <button id="register-submit-btn" class="auth-submit-btn" type="submit">
        CREATE ACCOUNT ➔
      </button>

      <div id="auth-feedback" class="auth-feedback" role="status" aria-live="polite"></div>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a class="auth-link" href="login.html">Sign in here</a></p>
      <a class="back-home-link" href="/leaderboard">🏆 View Leaderboard</a>
    </div>
  </main>
</body>

</html>
