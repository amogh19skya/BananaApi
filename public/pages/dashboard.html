<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Dashboard - Banana Brain Quest</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <script src="../js/dashboard.js" defer></script>
</head>

<body>
  <main class="dashboard-container">
    <div class="dashboard-header">
      <div class="player-info-row">
        <span class="player-avatar">🧠</span>
        <div>
          <h1 id="player-username" class="player-name">Player Dashboard</h1>
          <span class="player-badge">Ranked Challenger</span>
        </div>
      </div>
      <div class="dashboard-nav-links">
        <a class="dash-btn" href="../index.html">🎮 Play Game</a>
        <a class="dash-btn" href="leaderboard.html">🏆 Leaderboard</a>
      </div>
    </div>

    <section class="stats-summary-grid">
      <div class="dstat-card">
        <span class="dstat-label">TOTAL GAMES</span>
        <span id="dash-total-games" class="dstat-value">0</span>
      </div>
      <div class="dstat-card">
        <span class="dstat-label">BEST SCORE</span>
        <span id="dash-best-score" class="dstat-value">0</span>
      </div>
      <div class="dstat-card">
        <span class="dstat-label">ACCURACY</span>
        <span id="dash-accuracy" class="dstat-value">0%</span>
      </div>
    </section>

    <section class="recent-games-section">
      <h3>Recent Games</h3>
      <div id="history-container" class="history-list">
        <div class="history-item">
          <span>No game records yet. Complete a 10-question round to see your stats!</span>
        </div>
      </div>
    </section>

    <div class="footer-row" style="margin-top: 30px;">
      <a class="auth-link" href="../index.html">← Back to Quest Arena</a>
      <button id="logout-btn" class="replay-intro-btn" type="button">Logout</button>
    </div>
  </main>
</body>

</html>
